name: Deploy to Production — planning.trukumbholdings.co.zw

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build assets & trigger cPanel deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd, curl, openssl
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload built assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /planning.trukumbholdings.co.zw/public/build/
          local-dir: ./public/build/
          dangerous-clean-slate: false
        continue-on-error: true

      - name: Trigger cPanel Git Version Control update
        run: |
          RESPONSE=$(curl -s -o /tmp/cpanel_response.json -w "%{http_code}" \
            "https://cp69.domains.co.za:2083/execute/VersionControl/update" \
            -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            --insecure \
            -d "repository_root=/home/trukumbh/planning.trukumbholdings.co.zw")
          cat /tmp/cpanel_response.json
          echo "HTTP $RESPONSE"
          [ "$RESPONSE" = "200" ] && echo "Deployment triggered" || echo "Check cPanel manually"
        continue-on-error: true
